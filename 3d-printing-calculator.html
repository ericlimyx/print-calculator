<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Cost — 3D Printing Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #16181c;
    --panel: #1e2126;
    --panel-2: #24282f;
    --line: #33383f;
    --text: #eef0f2;
    --text-dim: #9aa1ab;
    --filament: #35e0a8;   /* teal-green, filament spool */
    --resin: #ff8a3d;      /* warm orange accent */
    --danger: #ff6b6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--bg), var(--bg)),
      repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(255,255,255,0.025) 24px),
      repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(255,255,255,0.025) 24px);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--filament);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .eyebrow::before{
    content:"";
    width:8px;height:8px;border-radius:1px;
    background:var(--filament);
    box-shadow:0 0 8px var(--filament);
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:clamp(28px,5vw,40px);
    font-weight:700;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  header p{color:var(--text-dim); margin:0; font-size:15px; max-width:52ch;}

  .grid{
    display:grid;
    grid-template-columns: 1.1fr 1fr;
    gap:20px;
  }
  @media (max-width:760px){
    .grid{grid-template-columns:1fr;}
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
  }
  .card h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-dim);
    margin:0 0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .field label span.unit{color:#666e79; font-family:'JetBrains Mono',monospace; font-size:11px;}
  .field input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    padding:10px 12px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{
    outline:none;
    border-color:var(--filament);
    box-shadow:0 0 0 3px rgba(53,224,168,0.15);
  }
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:20px 0;
  }

  /* Result layers — stacked like print layers */
  .layers{display:flex; flex-direction:column; gap:2px;}
  .layer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 14px;
    background:var(--panel-2);
    border-left:3px solid var(--line);
    font-size:14px;
  }
  .layer .name{color:var(--text-dim);}
  .layer .val{font-family:'JetBrains Mono', monospace; font-weight:500;}
  .layer.material{border-left-color:var(--filament);}
  .layer.power{border-left-color:#5aa9ff;}
  .layer.wear{border-left-color:#c78bff;}
  .layer.labor{border-left-color:var(--resin);}
  .layer.waste{border-left-color:var(--danger);}

  .total-block{
    margin-top:16px;
    padding:20px;
    border-radius:10px;
    background:linear-gradient(135deg, rgba(53,224,168,0.10), rgba(255,138,61,0.06));
    border:1px solid rgba(53,224,168,0.25);
  }
  .total-block .label{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .total-block .price{
    font-family:'Space Grotesk', sans-serif;
    font-size:38px;
    font-weight:700;
    color:var(--filament);
    margin-top:4px;
  }
  .total-block .sub{
    font-size:12.5px;
    color:var(--text-dim);
    margin-top:6px;
  }

  .markup-toggle{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .markup-toggle input{width:64px; text-align:right; padding:6px 8px; font-size:13px;}

  footer{
    text-align:center;
    color:#5b6169;
    font-size:12px;
    margin-top:32px;
    font-family:'JetBrains Mono', monospace;
  }

  @media (prefers-reduced-motion: no-preference){
    .card{transition:transform .15s ease;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Extruding numbers</div>
    <h1>3D Print Cost Calculator</h1>
    <p>Fill in your print job details on the left. Your price breakdown updates live on the right, layer by layer.</p>
  </header>

  <div class="grid">
    <!-- INPUTS -->
    <div class="card">
      <h2>Print Job</h2>

      <div class="field">
        <label>Filament price <span class="unit">$ / kg</span></label>
        <input type="number" id="filamentPrice" value="22" step="0.5" min="0">
      </div>

      <div class="field">
        <label>Filament used <span class="unit">grams</span></label>
        <input type="number" id="filamentWeight" value="45" step="1" min="0">
      </div>

      <div class="field-row">
        <div class="field">
          <label>Print time <span class="unit">hours</span></label>
          <input type="number" id="printHours" value="6" step="0.25" min="0">
        </div>
        <div class="field">
          <label>Printer power <span class="unit">watts</span></label>
          <input type="number" id="printerWatts" value="120" step="5" min="0">
        </div>
      </div>

      <div class="field">
        <label>Electricity rate <span class="unit">$ / kWh</span></label>
        <input type="number" id="elecRate" value="0.28" step="0.01" min="0">
      </div>

      <hr class="divider">

      <div class="field-row">
        <div class="field">
          <label>Printer cost <span class="unit">$</span></label>
          <input type="number" id="printerCost" value="400" step="10" min="0">
        </div>
        <div class="field">
          <label>Expected lifetime <span class="unit">hours</span></label>
          <input type="number" id="printerLifetime" value="3000" step="50" min="1">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Labor time <span class="unit">minutes</span></label>
          <input type="number" id="laborMinutes" value="15" step="1" min="0">
        </div>
        <div class="field">
          <label>Labor rate <span class="unit">$ / hour</span></label>
          <input type="number" id="laborRate" value="20" step="1" min="0">
        </div>
      </div>

      <div class="field">
        <label>Failure / waste rate <span class="unit">%</span></label>
        <input type="number" id="failureRate" value="10" step="1" min="0" max="90">
      </div>

      <div class="field">
        <label>Markup <span class="unit">%</span></label>
        <input type="number" id="markup" value="40" step="5" min="0">
      </div>
    </div>

    <!-- OUTPUT -->
    <div class="card">
      <h2>Cost Breakdown</h2>
      <div class="layers" id="layers"></div>

      <div class="total-block">
        <div class="label">Suggested price</div>
        <div class="price" id="finalPrice">$0.00</div>
        <div class="sub" id="marginNote"></div>
      </div>
    </div>
  </div>

  <footer>made with filament, watts, and a little markup</footer>
</div>

<script>
function num(id){
  const v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? 0 : v;
}

function fmt(n){
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function calculate(){
  const filamentPrice = num('filamentPrice');
  const filamentWeight = num('filamentWeight');
  const printHours = num('printHours');
  const printerWatts = num('printerWatts');
  const elecRate = num('elecRate');
  const printerCost = num('printerCost');
  const printerLifetime = num('printerLifetime') || 1;
  const laborMinutes = num('laborMinutes');
  const laborRate = num('laborRate');
  const failureRate = num('failureRate') / 100;
  const markup = num('markup') / 100;

  const materialCost = (filamentWeight / 1000) * filamentPrice;
  const kWh = (printerWatts / 1000) * printHours;
  const powerCost = kWh * elecRate;
  const depreciationCost = (printerCost / printerLifetime) * printHours;
  const laborCost = (laborMinutes / 60) * laborRate;

  const baseCost = materialCost + powerCost + depreciationCost + laborCost;
  const wasteCost = baseCost * (failureRate / (1 - failureRate || 1));
  const subtotal = baseCost + wasteCost;
  const finalPrice = subtotal * (1 + markup);

  const layers = document.getElementById('layers');
  layers.innerHTML = `
    <div class="layer material"><span class="name">Material</span><span class="val">${fmt(materialCost)}</span></div>
    <div class="layer power"><span class="name">Electricity (${kWh.toFixed(2)} kWh)</span><span class="val">${fmt(powerCost)}</span></div>
    <div class="layer wear"><span class="name">Printer wear</span><span class="val">${fmt(depreciationCost)}</span></div>
    <div class="layer labor"><span class="name">Labor</span><span class="val">${fmt(laborCost)}</span></div>
    <div class="layer waste"><span class="name">Failure buffer (${(failureRate*100).toFixed(0)}%)</span><span class="val">${fmt(wasteCost)}</span></div>
  `;

  document.getElementById('finalPrice').textContent = fmt(finalPrice);
  document.getElementById('marginNote').textContent =
    `Base cost ${fmt(subtotal)} · +${(markup*100).toFixed(0)}% markup → profit ${fmt(finalPrice - subtotal)}`;
}

document.querySelectorAll('input').forEach(el => el.addEventListener('input', calculate));
calculate();
</script>
</body>
</html>
